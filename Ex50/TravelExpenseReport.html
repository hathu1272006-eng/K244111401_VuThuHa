<html>
  <head>
    <title>Tiêu đề trang</title>
  </head>
  <body style="background-color: rgb(153, 240, 255)">
    <div align="center">
      <img src="images/DeLong.jpg">
    </div>
    <h1>Travel Expense Report</h1>
    <hr/>
    <form action="travel.html" method="post">
      <table>
        <tr>
          <td>1) First Name</td>
          <td><input type="text" name="firstName"/></td>
          <td>Last Name</td>
          <td><input type="text" name="lastName"/></td>
        </tr>
        <tr>
          <td>2) Social Security Number:</td>
          <td><input type="text" name="socialSecurityNumber"/></td>
        </tr>
        <tr>
          <td>Department</td>
          <td>
            <select name="department" size="1"
            onchange="this.form.department.value=this.value;">
              <option value="Accounting">Accounting</option>
              <option value="Sales">Sales</option>
              <option value="Marketing">Marketing</option>
              <option value="Engineering">Engineering</option>
              <option value="Human Resources">Human Resources</option>
            </select>
          </td>
        </tr>
        <tr>
          <td colspan="4">4) Describe the purpose of your trip</td>
        </tr>
        <tr>
          <td colspan="4"><textarea name="tripPurpose" rows="4" cols="50"></textarea></td>
        </tr>
        <tr>
          <td>5) Itemize your travel expenses</td>
        </tr>
        <tr> 
          <table border="1" cellspacing="2" cellpadding="10">
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Amount</th>
            </tr>
            <tr>
              <td><input type="date" name="expenseDate1"/></td>
              <td><input type="text" name="expenseDescription1"/></td>
              <td>
                <select name="expenseCategory1" size="1"
                onchange="this.form.expenseCategory1.value=this.value;">
                  <option value="Transportation">Transportation</option>
                  <option value="Lodging">Lodging</option>
                  <option value="Meals">Meal</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </td>
              <td><input type="text" name="expenseAmount1"/></td>
            </tr>
            <tr>
              <td><input type="date" name="expenseDate2"/></td>
              <td><input type="text" name="expenseDescription2"/></td>
              <td>
                <select name="expenseCategory2" size="1"
                onchange="this.form.expenseCategory2.value=this.value;">
                  <option value="Transportation">Transportation</option>
                  <option value="Lodging">Lodging</option>
                  <option value="Meals">Meal</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </td>
              <td><input type="text" name="expenseAmount2"/></td>
            </tr>
            <tr>
              <td><input type="date" name="expenseDate3"/></td>
              <td><input type="text" name="expenseDescription3"/></td>
              <td>
                <select name="expenseCategory3" size="1"
                onchange="this.form.expenseCategory3.value=this.value;">
                  <option value="Transportation">Transportation</option>
                  <option value="Lodging">Lodging</option>
                  <option value="Meals">Meal</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </td>
              <td><input type="text" name="expenseAmount3"/></td>
            </tr>
            <tr>
              <td><input type="date" name="expenseDate4"/></td>
              <td><input type="text" name="expenseDescription4"/></td>
              <td>
                <select name="expenseCategory4" size="1"
                onchange="this.form.expenseCategory4.value=this.value;">
                  <option value="Transportation">Transportation</option>
                  <option value="Lodging">Lodging</option>
                  <option value="Meals">Meal</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </td>
              <td><input type="text" name="expenseAmount4"/></td>
            </tr>
          </table>
        <tr>
          <td>6) Have you submitted your receipt?</td>
          <td><input type="radio" name="submittedReceipt" value="Yes"/> Yes
              <input type="radio" name="submittedReceipt" value="No"/> No
          </td>
        </tr>
        <br/>
        <tr>
          <td><input type="button" value="Submit Report" onclick="submitReport()"/></td>
          <td><input type="reset" value="Reset Form"/></td>
        </tr>
        <tr>
          <td>
            <p>Question? Contact Debbie Larson in Accounting (ext. 2150)</p>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
