<html>
  <head>
    <title>Tiêu đề trang</title>
    <script>
      function findSolution() {
      var a = Number(myform.a.value);
      var b = Number(myform.b.value);
      var c = Number(myform.c.value);
      
      if (a == 0) {
        if (b == 0) {
          if (c == 0) {
            myform.result.value = "Phương trình vô số nghiệm";
          } else {
            myform.result.value = "Phương trình vô nghiệm";
          }
        } else {
          var x = -c / b;
          myform.result.value = "x = " + x;
        }

        return;
      }


        var delta = b*b - 4*a*c;

        if (delta < 0){
          myform.result.value = "Phương trình vô nghiệm";
        } 
        
        else if (delta == 0){
          var x = -b/(2*a);
          myform.result.value = "x1 = x2 = " + x;
        } 
        
        else {
          var x1 = (-b + Math.sqrt(delta)) / (2*a);
          var x2 = (-b - Math.sqrt(delta)) / (2*a);
          myform.result.value = "x1 = " + x1 + "; x2 = " + x2;
        }
      }

      function clearForm(){
        myform.a.value = "";
        myform.b.value = "";
        myform.c.value = "";
        myform.result.value = "";
      }
    </script>
  </head>
  <body>
    <form name="myform">
      <table border="1">
        <colgroup>
          <col style="width: 120px;">
          <col style="width: 300px;">
        </colgroup>
        <tr>
          <th colspan="2" style="background-color: rgb(199, 255, 199); text-align: center;">The quadratic equation</th>
        </tr>
        <tr>
          <td>a:</td>
          <td><input type="number" name="a" style="width: 100%;"></td>
        </tr>
        <tr>
          <td>b:</td>
          <td><input type="number" name="b" style="width: 100%;"></td>
        </tr>
        <tr>
          <td>c:</td>
          <td><input type="number" name="c" style="width: 100%;"></td>
        </tr>
        <tr>
          <td>Result:</td>
          <td><input type="text" name="result" readonly style="width: 100%;"></td>
        </tr>
        <tr>
          <td></td>
          <td>
            <button type="button" onclick="findSolution()">Find Solution</button> 
            <button type="button" onclick="clearForm()">Clear</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
